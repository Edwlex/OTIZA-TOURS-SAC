<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Chofer - Otiza Tours</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .seat-btn { transition: all 0.2s; cursor: pointer; }
        .seat-btn:hover:not(.ocupado):not(.reservado):not(.seleccionado) { 
            transform: translateY(-2px); border-color: #3B82F6; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2); 
        }
        .seat-btn.seleccionado { 
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); color: white; 
            border-color: #3B82F6; transform: scale(1.1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); 
        }
        .seat-btn.ocupado { background: #EF4444; color: white; cursor: not-allowed; opacity: 0.6; }
        .seat-btn.reservado { background: #8B5CF6; color: white; cursor: not-allowed; position: relative; }
        .seat-btn.reservado::after { content: "👤"; position: absolute; top: 2px; right: 4px; font-size: 10px; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-gradient-to-r from-indigo-700 to-purple-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center"><i class="fas fa-id-card text-lg"></i></div>
                <div>
                    <h1 class="font-bold text-lg">Juan Pérez</h1>
                    <p class="text-xs text-indigo-200">Chofer • ABC-123</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="bg-white/20 px-3 py-1.5 rounded-full text-sm flex items-center gap-2">
                    <i class="fas fa-ticket-alt"></i> 2 reservas hoy
                </span>
                <a href="#" class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-6xl mx-auto w-full p-4 md:p-6 space-y-6 pb-32">
        <div class="flex items-center justify-between">
            <h2 class="text-2xl font-bold text-gray-800">Reservar Mi Asiento</h2>
            <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full"><i class="fas fa-calendar-day mr-1"></i> Hoy, 21 Jul 2026</span>
        </div>

        <!-- VIAJES -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <h3 class="font-semibold text-gray-800 mb-4 flex items-center gap-2"><i class="fas fa-route text-indigo-600"></i> Selecciona tu Viaje</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <label class="cursor-pointer">
                    <input type="radio" name="viaje" class="peer sr-only" checked onchange="cambiarViaje('Trujillo → Julcán')">
                    <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50/50 hover:border-indigo-300 transition relative">
                        <span class="absolute top-3 right-3 bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full">12 libres</span>
                        <p class="font-bold text-gray-800 text-lg">Trujillo → Julcán</p>
                        <p class="text-sm text-gray-600 mt-1">🕐 08:00 AM • 🚌 ABC-123</p>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="viaje" class="peer sr-only" onchange="cambiarViaje('Trujillo → Mache')">
                    <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50/50 hover:border-indigo-300 transition relative">
                        <span class="absolute top-3 right-3 bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-1 rounded-full">3 libres</span>
                        <p class="font-bold text-gray-800 text-lg">Trujillo → Mache</p>
                        <p class="text-sm text-gray-600 mt-1">🕐 10:30 AM • 🚌 XYZ-789</p>
                    </div>
                </label>
                <label class="cursor-not-allowed opacity-60">
                    <input type="radio" name="viaje" class="peer sr-only" disabled>
                    <div class="p-4 rounded-xl border-2 border-gray-200 bg-gray-50 relative">
                        <span class="absolute top-3 right-3 bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded-full">Agotado</span>
                        <p class="font-bold text-gray-800 text-lg">Julcán → Trujillo</p>
                        <p class="text-sm text-gray-600 mt-1"> 14:00 PM • 🚌 DEF-456</p>
                    </div>
                </label>
            </div>
        </div>

        <!-- LEYENDA -->
        <div class="flex flex-wrap gap-4 text-sm text-gray-600 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
            <span class="flex items-center gap-2"><span class="w-4 h-4 bg-gray-100 border border-gray-300 rounded"></span> Libre</span>
            <span class="flex items-center gap-2"><span class="w-4 h-4 bg-red-500 rounded"></span> Vendido</span>
            <span class="flex items-center gap-2"><span class="w-4 h-4 bg-purple-500 rounded"></span> Reservado (Otro Chofer)</span>
            <span class="flex items-center gap-2"><span class="w-4 h-4 bg-blue-500 rounded"></span> Tu Selección</span>
        </div>

        <!-- MAPA -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="text-center mb-6 text-gray-400 font-bold uppercase tracking-widest text-xs">Frente del Bus </div>
            <div class="grid grid-cols-4 gap-4 justify-items-center max-w-md mx-auto">
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('01A', this)">01A</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('01B', this)">01B</button>
                <button class="seat-btn ocupado w-full h-14 rounded-xl border-2 border-red-300 font-bold flex items-center justify-center" disabled>01C</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('01D', this)">01D</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('02A', this)">02A</button>
                <button class="seat-btn reservado w-full h-14 rounded-xl border-2 border-purple-300 font-bold flex items-center justify-center" disabled>02B</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('02C', this)">02C</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('02D', this)">02D</button>
                <button class="seat-btn ocupado w-full h-14 rounded-xl border-2 border-red-300 font-bold flex items-center justify-center" disabled>03A</button>
                <button class="seat-btn ocupado w-full h-14 rounded-xl border-2 border-red-300 font-bold flex items-center justify-center" disabled>03B</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('03C', this)">03C</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('03D', this)">03D</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('04A', this)">04A</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('04B', this)">04B</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('04C', this)">04C</button>
                <button class="seat-btn w-full h-14 rounded-xl border-2 border-gray-200 bg-gray-50 font-bold text-gray-700 flex items-center justify-center" onclick="seleccionarAsiento('04D', this)">04D</button>
            </div>
        </div>

        <!-- RESERVAS -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <h3 class="font-semibold text-gray-800 mb-4 flex items-center gap-2"><i class="fas fa-ticket-alt text-indigo-600"></i> Mis Reservas Activas</h3>
            <div class="space-y-3">
                <div class="flex items-center justify-between p-4 bg-indigo-50 rounded-lg border border-indigo-200">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600 font-bold">02A</div>
                        <div>
                            <p class="font-semibold text-gray-800">Trujillo → Julcán</p>
                            <p class="text-xs text-gray-500">🕐 08:00 AM • 📅 Hoy</p>
                        </div>
                    </div>
                    <button onclick="alert('Reserva cancelada (Simulación)')" class="text-sm text-red-600 hover:text-red-800 font-medium bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition">Cancelar</button>
                </div>
            </div>
        </div>
    </main>

    <!-- PANEL CONFIRMACIÓN -->
    <div id="panelConfirmacion" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl p-4 hidden z-50 animate-slide-up">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-xl"><i class="fas fa-check"></i></div>
                <div>
                    <p class="font-bold text-gray-800">Asiento <span id="txtAsiento" class="text-blue-600">--</span> seleccionado</p>
                    <p class="text-sm text-gray-500">Ruta: <span id="txtRuta">Trujillo → Julcán</span></p>
                </div>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="cerrarPanel()" class="flex-1 md:flex-none px-4 py-2.5 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition">Volver</button>
                <button onclick="alert('✅ Reserva confirmada (Simulación)'); cerrarPanel();" class="flex-1 md:flex-none px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition shadow-lg flex items-center justify-center gap-2"><i class="fas fa-check-circle"></i> Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        let rutaActual = "Trujillo → Julcán";
        function cambiarViaje(ruta) { rutaActual = ruta; document.getElementById('txtRuta').textContent = ruta; cerrarPanel(); }
        function seleccionarAsiento(num, el) {
            if(el.classList.contains('ocupado') || el.classList.contains('reservado')) return alert('No disponible');
            document.querySelectorAll('.seat-btn').forEach(b => b.classList.remove('seleccionado'));
            el.classList.add('seleccionado');
            document.getElementById('txtAsiento').textContent = num;
            document.getElementById('panelConfirmacion').classList.remove('hidden');
        }
        function cerrarPanel() { 
            document.getElementById('panelConfirmacion').classList.add('hidden'); 
            document.querySelectorAll('.seat-btn').forEach(b => b.classList.remove('seleccionado')); 
        }
    </script>
</body>
</html>
