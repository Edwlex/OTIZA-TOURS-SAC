{% if messages %}
<div class="fixed top-20 right-6 z-50 space-y-2">
    {% for message in messages %}
    <div class="px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 {% if message.tags == 'error' %}bg-red-500 text-white{% elif message.tags == 'success' %}bg-green-500 text-white{% else %}bg-blue-500 text-white{% endif %}">
        <div class="flex items-center gap-2">
            {% if message.tags == 'error' %}
                <i class="fas fa-exclamation-circle"></i>
            {% elif message.tags == 'success' %}
                <i class="fas fa-check-circle"></i>
            {% else %}
                <i class="fas fa-info-circle"></i>
            {% endif %}
            <span class="font-medium">{{ message }}</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
