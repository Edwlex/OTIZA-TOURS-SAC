<aside id="sidebar"
    class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-gradient-to-b from-otiza-dark to-otiza-green text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col shadow-xl">

    <!-- Logo -->
    <div class="h-16 flex items-center px-6 border-b border-white/20 flex-shrink-0">
        <i class="fas fa-bus text-2xl mr-3 text-white/90"></i>
        <div>
            <h1 class="text-lg font-bold tracking-wide">Otiza Tours</h1>
            <p class="text-[10px] text-green-200 uppercase tracking-widest">Sistema de Gestión</p>
        </div>
    </div>

    <!-- Menú -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scrollbar">

        <!-- Dashboard -->
        <a href="{% url 'core:dashboard' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if request.resolver_match.url_name == 'dashboard' %}bg-white/20 border-l-4 border-yellow-400{% endif %} hover:bg-white/10 transition">
            <i class="fas fa-home w-5"></i>
            <span class="font-medium">Dashboard</span>
        </a>

        <!-- Ventas -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Ventas</p>
        </div>

        <a href="{% url 'core:ventas_lista' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
            <i class="fas fa-ticket-alt w-5"></i>
            <span class="font-medium">Venta de Pasajes</span>
        </a>

        <!-- Clientes -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Clientes</p>
        </div>

        <a href="{% url 'core:buscar_cliente' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
            <i class="fas fa-search w-5"></i>
            <span class="font-medium">Buscar Cliente</span>
        </a>

        <a href="{% url 'core:fidelizacion' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if 'fidelizacion' in request.resolver_match.url_name %}bg-white/20 border-l-4 border-yellow-400{% endif %} hover:bg-white/10 transition">
            <i class="fas fa-star w-5"></i>
            <span class="font-medium">Fidelización</span>
            <span class="ml-auto bg-yellow-400 text-yellow-900 text-xs font-bold px-2 py-1 rounded-full">12</span>
        </a>

        <!-- Reportes -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Reportes</p>
        </div>

        <a href="{% url 'core:reporte_diario' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if 'reporte_diario' in request.resolver_match.url_name %}bg-white/20 border-l-4 border-yellow-400{% endif %} hover:bg-white/10 transition">
            <i class="fas fa-calendar-day w-5"></i>
            <span>Diario</span>
        </a>

        <a href="{% url 'core:reporte_semanal' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
            <i class="fas fa-calendar-week w-5"></i>
            <span>Semanal</span>
        </a>

        <a href="{% url 'core:reporte_mensual' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
            <i class="fas fa-calendar-alt w-5"></i>
            <span>Mensual</span>
        </a>

        <!-- SISTEMA (ÚNICA SECCIÓN - Incluye Notificaciones e Incidencias) -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Sistema</p>
        </div>

        <a href="{% url 'core:notificaciones_lista' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if 'notificaciones' in request.resolver_match.url_name %}bg-white/20 border-l-4 border-yellow-400{% endif %} hover:bg-white/10 transition relative">
            <i class="fas fa-bell w-5"></i>
            <span class="font-medium">Notificaciones</span>
            <span id="notifBadge"
                class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">3</span>
        </a>

        <a href="{% url 'core:incidencias_lista' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
            <i class="fas fa-exclamation-triangle w-5"></i>
            <span>Incidencias</span>
            <span class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">0</span>
        </a>

        <!-- CUENTA (Nueva Sección) -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Cuenta</p>
        </div>

        <a href="{% url 'core:mi_perfil' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if 'mi_perfil' in request.resolver_match.url_name %}bg-white/20 border-l-4 border-yellow-400{% endif %} hover:bg-white/10 transition">
            <i class="fas fa-user-circle w-5"></i>
            <span class="font-medium">Mi Perfil</span>
        </a>

        <a href="{% url 'core:logout' %}"
            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-red-600/20 hover:text-red-100 transition border-l-4 border-transparent hover:border-red-500">
            <i class="fas fa-sign-out-alt w-5"></i>
            <span class="font-medium">Cerrar Sesión</span>
        </a>

    </nav>

    <!-- Footer Sidebar (Info de Sede) -->
    <div class="p-4 border-t border-white/20 flex-shrink-0 bg-black/10 backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                <i class="fas fa-map-marker-alt text-white"></i>
            </div>
            <div>
                <p class="text-sm font-bold">{{ sede.nombre|title }}</p>
                <p class="text-xs text-green-200">Sede Activa</p>
            </div>
        </div>
    </div>
</aside>
