<!-- Sidebar -->
<aside id="sidebar" class="sidebar fixed inset-y-0 left-0 z-50 w-64 bg-gradient-to-b from-otiza-dark to-otiza-green text-white transform -translate-x-full md:translate-x-0 md:static md:inset-0 shadow-2xl">
    
    <!-- Logo -->
    <div class="flex items-center justify-center h-20 border-b border-white/20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                <i class="fas fa-bus text-otiza-green text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">Otiza Tours</h1>
                <p class="text-xs text-green-200">Sistema de Gestión</p>
            </div>
        </div>
    </div>

    <!-- Menú de Navegación -->
    <nav class="mt-6 px-4 space-y-2">
        
        <!-- Dashboard -->
        <a href="{% url 'core:dashboard' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <i class="fas fa-home w-5"></i>
            <span class="font-medium">Dashboard</span>
        </a>

        <!-- Ventas -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Ventas</p>
        </div>
        
        <a href="{% url 'core:ventas_lista' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if 'ventas' in request.resolver_match.url_name %}active{% endif %}">
            <i class="fas fa-ticket-alt w-5"></i>
            <span class="font-medium">Venta de Pasajes</span>
        </a>
        
        <a href="{% url 'core:reporte_diario' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg">
            <i class="fas fa-chart-line w-5"></i>
            <span class="font-medium">Reporte de Ventas</span>
        </a>

        <!-- Clientes -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Clientes</p>
        </div>
        
        <a href="{% url 'core:fidelizacion' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg {% if 'fidelizacion' in request.resolver_match.url_name %}active{% endif %}">
            <i class="fas fa-star w-5"></i>
            <span class="font-medium">Fidelización</span>
            <span class="ml-auto bg-yellow-400 text-yellow-900 text-xs font-bold px-2 py-1 rounded-full">12</span>
        </a>
        
        <a href="#" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg"
           onclick="buscarCliente(); return false;">
            <i class="fas fa-search w-5"></i>
            <span class="font-medium">Buscar Cliente</span>
        </a>

        <!-- Reportes -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Reportes</p>
        </div>
        
        <a href="{% url 'core:reporte_diario' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg">
            <i class="fas fa-calendar-day w-5"></i>
            <span class="font-medium">Diario</span>
        </a>
        
        <a href="{% url 'core:reporte_semanal' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg">
            <i class="fas fa-calendar-week w-5"></i>
            <span class="font-medium">Semanal</span>
        </a>
        
        <a href="{% url 'core:reporte_mensual' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg">
            <i class="fas fa-calendar-alt w-5"></i>
            <span class="font-medium">Mensual</span>
        </a>

        <!-- Incidencias -->
        <div class="pt-4 pb-2">
            <p class="px-4 text-xs font-semibold text-green-200 uppercase tracking-wider">Sistema</p>
        </div>
        
        <a href="{% url 'core:incidencias_lista' %}" 
           class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg">
            <i class="fas fa-exclamation-triangle w-5"></i>
            <span class="font-medium">Incidencias</span>
            <span id="incidenciasCount" class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">0</span>
        </a>

    </nav>

    <!-- Info de Sede -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-white/20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                <i class="fas fa-map-marker-alt text-white"></i>
            </div>
            <div class="flex-1">
                <p class="text-sm font-semibold">{{ sede.get_nombre_display }}</p>
                <p class="text-xs text-green-200">Sede Activa</p>
            </div>
        </div>
    </div>
</aside>

<script>
function buscarCliente() {
    const dni = prompt('Ingrese DNI del cliente:');
    if (dni) {
        window.location.href = `/clientes/historial/${dni}/`;
    }
}
</script>
