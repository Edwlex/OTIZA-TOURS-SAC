{% extends 'admin/base_admin.html' %}

{% block title %}Nuevo Vehículo - Otiza Tours{% endblock %}

{% block page_title %}
<h2 class="text-lg font-bold text-gray-800">Registrar Nuevo Vehículo</h2>
<p class="text-xs text-gray-500">Agrega un bus o combi a la flota</p>
{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <!-- Tarjeta del Formulario -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-6 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
            <h3 class="text-lg font-bold text-gray-800">Datos del Vehículo</h3>
            <a href="{% url 'core:vehiculos_lista' %}" class="text-sm text-gray-500 hover:text-indigo-600 transition">
                <i class="fas fa-arrow-left mr-1"></i> Volver a la lista
            </a>
        </div>

        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}

            <!-- Fila 1: Placa y Marca -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Placa *</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400"><i class="fas fa-id-card"></i></span>
                        <input type="text" name="placa" required placeholder="Ej: ABC-123" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition uppercase font-bold tracking-wider">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Marca *</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400"><i class="fas fa-car"></i></span>
                        <select name="marca" required class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition bg-white">
                            <option value="" disabled selected>Selecciona una marca</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Nissan">Nissan</option>
                            <option value="Mercedes">Mercedes Benz</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Volvo">Volvo</option>
                            <option value="Otra">Otra</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Fila 2: Modelo y Año -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Modelo *</label>
                    <input type="text" name="modelo" required placeholder="Ej: Hiace, Urvan, Coaster" 
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Año *</label>
                    <input type="number" name="año" required min="1990" max="2030" placeholder="2024" 
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Fila 3: Capacidad y Estado -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Capacidad de Asientos *</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400"><i class="fas fa-users"></i></span>
                        <input type="number" name="asientos" required min="1" placeholder="Ej: 16" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Estado Inicial *</label>
                    <select name="estado" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition bg-white">
                        <option value="Activo">Activo (Listo para operar)</option>
                        <option value="Mantenimiento">En Mantenimiento</option>
                        <option value="Inactivo">Inactivo (Fuera de servicio)</option>
                    </select>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="pt-6 border-t border-gray-200 flex justify-end gap-4">
                <a href="{% url 'core:vehiculos_lista' %}" class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition shadow-md flex items-center gap-2">
                    <i class="fas fa-save"></i> Guardar Vehículo
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
