{% extends 'admin/base_admin.html' %}

{% block title %}Editar Horario Fijo - Otiza Tours{% endblock %}

{% block page_title %}
<h2 class="text-lg font-bold text-gray-800">️ Editar Horario Fijo</h2>
<p class="text-xs text-gray-500">Modifica los detalles del horario</p>
{% endblock %}

{% block content %}

<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 max-w-4xl mx-auto">
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Ruta -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Ruta</label>
                <select name="ruta" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    {% for ruta in rutas %}
                    <option value="{{ ruta.id }}" {% if horario.ruta.id == ruta.id %}selected{% endif %}>
                        {{ ruta.origen }} → {{ ruta.destino }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Vehículo -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Vehículo</label>
                <select name="vehiculo" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    {% for veh in vehiculos %}
                    <option value="{{ veh.id }}" {% if horario.vehiculo.id == veh.id %}selected{% endif %}>
                        {{ veh.placa }} - {{ veh.modelo }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Hora de Salida -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Hora de Salida</label>
                <input type="time" name="hora_salida" value="{{ horario.hora_salida|date:'H:i' }}" 
                       required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <!-- Días -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Días</label>
                <input type="text" name="dias_semana" value="{{ horario.dias_semana }}" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                       placeholder="1,2,3,4,5,6,7">
                <p class="text-xs text-gray-500 mt-1">1=Lun, 2=Mar... 7=Dom</p>
            </div>
        </div>
        
        <!-- Botones -->
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
            <a href="{% url 'core:horarios_fijos_lista' %}" 
               class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                Cancelar
            </a>
            <button type="submit" 
                    class="px-6 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-medium">
                <i class="fas fa-save mr-2"></i>Guardar Cambios
            </button>
        </div>
    </form>
</div>

{% endblock %}
